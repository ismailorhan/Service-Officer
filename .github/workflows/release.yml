name: Release

# Build the exe + installer and publish a GitHub Release whenever a version
# tag (e.g. v1.1.0) is pushed. Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests -q

      # The release builds are the ones that most need to say which commit they
      # are, and this step is what puts it there. It also fails the build if the
      # tag, installer.iss and core/version.py disagree about the version.
      - name: Stamp the build
        run: python stamp_version.py

      - name: Build ServiceOfficer (one-dir; a Qt app re-extracted on every
              launch starts slowly)
        run: >
          python -m PyInstaller
          --noconfirm --clean --windowed --uac-admin
          --name ServiceOfficer --icon=icon.ico
          --add-data "icon.ico;."
          --hidden-import=win32timezone
          --exclude-module tkinter
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtNetwork --exclude-module PySide6.Qt3DCore
          app.py

      - name: Prune what a tray app never uses
        run: |
          $d = "dist/ServiceOfficer/_internal/PySide6"
          Remove-Item "$d/opengl32sw.dll","$d/libcrypto*","$d/libssl*","$d/Qt6Network.dll" -Force -ErrorAction SilentlyContinue
          "{0:N1} MB" -f ((Get-ChildItem dist/ServiceOfficer -Recurse | Measure-Object Length -Sum).Sum/1MB)

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Service Officer ${{ github.ref_name }}
          files: |
            dist/ServiceOfficerSetup.exe
          generate_release_notes: true
